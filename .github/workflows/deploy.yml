name: Build and deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acrpirela4827
  RESOURCE_GROUP: rg-cpsy300-w4d2-ap
  CONTAINERAPP: ca-pipeline-ap-v2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Azure secret fingerprints
        env:
          CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          for key in CLIENT TENANT SUBSCRIPTION; do
            value="${!key}"
            if [ -z "$value" ]; then
              echo "$key = MISSING"
            else
              echo "$key = $(printf '%s' "$value" | sha256sum | cut -c1-12)"
            fi
          done

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to the registry
        run: az acr login --name $ACR_NAME

      - name: Build and push
        run: |
          IMAGE=$ACR_NAME.azurecr.io/pipeline:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Deploy
        run: |
          az containerapp update \
            --name $CONTAINERAPP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/pipeline:${{ github.sha }}
